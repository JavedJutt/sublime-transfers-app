# Supabase local config for the Sublime Transfers ride-dispatch app.
# project_id is the local project name, not the remote ref.
project_id = "sublime_transfers"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# The Flutter app's deep-link scheme plus localhost for web dev.
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "io.supabase.sublimetransfers://login-callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# Confirmation is OFF for development so seeded and self-registered accounts can
# sign in immediately. Turn this ON before production and the app's sign-in flow
# already surfaces the "confirm your email" AuthFailure.
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false

# Public webhook endpoints: Google redirects and Pub/Sub push carry no user JWT.
[functions.gmail-oauth-callback]
verify_jwt = false

[functions.gmail-pubsub-webhook]
verify_jwt = false

[functions.gmail-watch-renew]
verify_jwt = false
